spring:
  application:
    name: reqai-backend
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/reqai}
    username: ${DB_USERNAME:reqai}
    password: ${DB_PASSWORD:reqai_dev}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: ${PORT:8080}
